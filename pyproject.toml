[project]
name = "ai-engineering-residency"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.4",
