services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: ai-residency-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # ------------------------------------------------------------------
      # KRaft identity
      # ------------------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Fixed cluster ID makes this local deployment reproducible.
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # ------------------------------------------------------------------
      # Listeners
      #
      # PLAINTEXT_HOST:
      #   macOS host applications -> localhost:9092
      #
      # PLAINTEXT:
      #   Docker-network communication -> kafka:19092
      #
      # CONTROLLER:
      #   KRaft controller traffic
      # ------------------------------------------------------------------
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      # ------------------------------------------------------------------
      # Single-node development settings
      #
      # Production clusters should use replication > 1.
      # ------------------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ------------------------------------------------------------------
      # Persistent broker storage
      # ------------------------------------------------------------------
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # Explicitly disable automatic topic creation for learning purposes.
      # Topics should be intentionally created.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

    restart: unless-stopped

volumes:
  kafka_data: